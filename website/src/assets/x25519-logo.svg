<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="X25519 椭圆曲线">
  <!-- 椭圆曲线 y² = x³ + Ax² + x 的主分支（Montgomery 形式，右侧开口） -->
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
    <path d="M15 32 C 24 27, 33 24, 41 24 C 49 24, 54 18, 57 9"/>
    <path d="M15 32 C 24 37, 33 40, 41 40 C 49 40, 54 46, 57 55"/>
  </g>
  <!-- 过基点的切线：点加倍 / 标量乘法的意象 -->
  <path d="M28 40 L 58 7" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
  <!-- 基点（曲线上的一点，示意 x = 9 附近的生成元） -->
  <circle cx="44" cy="21" r="5" fill="currentColor"/>
</svg>
